version: "3.9"

services:
  ai-core:
    build: ./ai-core
    expose:
      - "8000"   # só acessível pela rede interna do Docker (backend fala com ele por aqui)
    env_file: .env
    volumes:
      - ./ai-core:/app
    # Sem GPU aqui: bom pra dev/fallback Groq. Para usar o modelo local
    # (USE_LOCAL_MODEL=true), rode em uma máquina com GPU e adicione
    # 'deploy: resources: reservations: devices: [gpu]' conforme seu ambiente.

  backend:
    build: ./backend
    expose:
      - "3000"
    env_file: .env
    depends_on:
      - ai-core
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  worker:
    build: ./backend
    command: npm run worker
    env_file: .env
    depends_on:
      - ai-core
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Não roda sozinho — é chamado sob demanda pelo init-letsencrypt.sh
    # e depois renovado automaticamente por um cron no VPS (ver DEPLOY.md).
    entrypoint: "true"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
