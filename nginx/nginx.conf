server {
    listen 80;
    server_name 129.121.33.93;

    # Usado pelo certbot pra validar que você é dono do domínio.
    # Não mexa nisso — é o que permite emitir o certificado HTTPS depois.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Frontend estático (troque por um build real quando o design final estiver pronto)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API do backend Node.js
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.io (mini chat em tempo real) — precisa de upgrade de conexão
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
